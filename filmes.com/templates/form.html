<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% if filme %}Editar filme{% else %}Cadastrar filme{% endif %}</title>
    <style>
      :root {
        --primaria: #7c3aed;
        --primaria-escura: #5b21b6;
        --fundo: #f5f3ff;
        --fundo-card: #ffffff;
        --texto: #1f2937;
        --texto-suave: #6b7280;
        --sucesso: #10b981;
        --erro: #ef4444;
        --borda: #ddd6fe;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%);
        color: var(--texto);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: 100%;
        max-width: 560px;
        background: var(--fundo-card);
        border-radius: 18px;
        padding: 32px;
        box-shadow: 0 12px 28px rgba(91, 33, 182, 0.12);
      }

      h1 {
        margin-top: 0;
        margin-bottom: 24px;
        font-size: 2rem;
      }

      .mensagens {
        margin-bottom: 20px;
      }

      .mensagem {
        padding: 12px 14px;
        border-radius: 8px;
        margin-bottom: 10px;
        font-weight: 600;
      }

      .mensagem.sucesso {
        background: #eafaf1;
        color: var(--sucesso);
        border: 1px solid #b9e5cc;
      }

      .mensagem.erro {
        background: #fdecec;
        color: var(--erro);
        border: 1px solid #f3b8ba;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .campo {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-weight: 700;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--borda);
        border-radius: 10px;
        font-size: 1rem;
        background: #faf5ff;
      }

      input:focus {
        outline: 2px solid rgba(124, 58, 237, 0.18);
        border-color: var(--primaria);
      }

      .botoes {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 8px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 18px;
        border: none;
        border-radius: 10px;
        text-decoration: none;
        font-weight: bold;
        cursor: pointer;
        font-size: 1rem;
      }

      .btn-primary {
        background: var(--primaria);
        color: white;
      }

      .btn-primary:hover {
        background: var(--primaria-escura);
      }

      .btn-secondary {
        background: #ede9fe;
        color: var(--primaria-escura);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>{% if filme %}Editar filme{% else %}Cadastrar filme{% endif %}</h1>

      <div class="mensagens">
        {% with mensagens = get_flashed_messages(with_categories=true) %}
          {% if mensagens %}
            {% for categoria, mensagem in mensagens %}
              <div class="mensagem {{ categoria }}">{{ mensagem }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
      </div>

      <form method="post">
        <div class="campo">
          <label for="titulo">Título</label>
          <input id="titulo" name="titulo" type="text" value="{{ filme.titulo if filme else '' }}" required />
        </div>

        <div class="campo">
          <label for="genero">Gênero</label>
          <input id="genero" name="genero" type="text" value="{{ filme.genero if filme else '' }}" required />
        </div>

        <div class="campo">
          <label for="ano">Ano</label>
          <input id="ano" name="ano" type="number" min="1888" max="2100" value="{{ filme.ano if filme else '' }}" required />
        </div>

        <div class="campo">
          <label for="nota">Nota</label>
          <input id="nota" name="nota" type="number" min="1" max="10" step="0.1" value="{{ filme.nota if filme else '' }}" required />
        </div>

        <div class="botoes">
          <button class="btn btn-primary" type="submit">{% if filme %}Salvar alterações{% else %}Cadastrar{% endif %}</button>
          <a class="btn btn-secondary" href="{{ url_for('index') }}">Voltar</a>
        </div>
      </form>
    </div>
  </body>
</html>
