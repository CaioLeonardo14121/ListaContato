<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Caixa de correio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="pagina-interna">
    <header class="cabecalho">
        <div class="container navegacao">
            <a href="{{ url_for('index') }}" class="logo">CL<span>.</span></a>
            <a href="{{ url_for('index') }}">Voltar ao portfólio</a>
        </div>
    </header>

    <main class="container area-login">
        <section class="painel-login">
            <p class="destaque">ÁREA PRIVADA</p>
            <h1>Caixa de <span>correio</span></h1>
            <p>Digite sua senha para visualizar as mensagens recebidas.</p>

            {% if erro %}
                <p class="erro">{{ erro }}</p>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}">
                <label for="senha">Senha de acesso</label>
                <input type="password" id="senha" name="senha"
                       required autocomplete="current-password">
                <button class="botao" type="submit">Entrar na caixa de entrada</button>
            </form>
        </section>
    </main>
</body>
</html>
